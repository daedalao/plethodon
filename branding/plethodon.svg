<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>SiskiyouPlethodon</title>
  <defs>
    <clipPath id="bs-disc"><circle cx="64" cy="64" r="62"/></clipPath>
  </defs>
  <!-- Biscuit Fire sky -->
  <circle cx="64" cy="64" r="62" fill="#D9531F"/>
  <g clip-path="url(#bs-disc)">
    <!-- glow along the ridge -->
    <path d="M0 78 C 30 70, 60 84, 128 72 L128 128 L0 128 Z" fill="#EE7A33"/>
    <!-- Siskiyou talus, bottom right -->
    <path d="M58 128 L66 108 L80 102 L90 110 L100 98 L116 100 L128 92 L128 128 Z" fill="#1B1714"/>
    <path d="M84 128 L92 118 L106 116 L112 124 L118 116 L128 118 L128 128 Z" fill="#2E2823"/>
  </g>
  <!-- the salamander, top view, crossing the badge -->
  <g fill="none" stroke="#2A1C16" stroke-linecap="round" stroke-linejoin="round">
    <!-- legs -->
    <path d="M76 45 L66 39 L62 41" stroke-width="4.5"/>
    <path d="M79 49 L88 53 L91 51" stroke-width="4.5"/>
    <path d="M63 68 L54 63 L51 65" stroke-width="4.5"/>
    <path d="M65 72 L71 80 L70 84" stroke-width="4.5"/>
    <!-- body and tapering tail -->
    <path d="M81 37 C 77 46, 75 54, 70 61 S 63 69, 61 72" stroke-width="12"/>
    <path d="M61 72 C 53 79, 46 86, 45 95" stroke-width="8.5"/>
    <path d="M45 95 C 44 102, 48 107, 55 108" stroke-width="5.5"/>
    <path d="M55 108 C 59 108, 62 106, 63 103" stroke-width="3"/>
  </g>
  <!-- head -->
  <ellipse cx="84" cy="30" rx="8.5" ry="7" transform="rotate(-58 84 30)" fill="#2A1C16"/>
  <!-- eyes and brassy flecks -->
  <g fill="#E8C77A">
    <circle cx="81.2" cy="25.8" r="1.5"/>
    <circle cx="88.6" cy="29.6" r="1.5"/>
    <circle cx="78.6" cy="41" r="1.3"/>
    <circle cx="75.4" cy="49.5" r="1.1"/>
    <circle cx="72.2" cy="56.5" r="1.3"/>
    <circle cx="66.6" cy="64.2" r="1.1"/>
    <circle cx="57.4" cy="76.6" r="1.1"/>
    <circle cx="50.6" cy="84.8" r="1.0"/>
    <circle cx="46.8" cy="93.6" r="0.9"/>
  </g>
</svg>
